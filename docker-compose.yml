version: '3'

services:
  ideas_portal_dev:
    container_name: ideas_portal_dev
    image: cloudblueconnect/connect-extension-runner:26.38
    command: cextrun -d
    volumes: 
      - .:/extension
    env_file:
      - .ideas_portal_dev.env

  ideas_portal_bash:
    container_name: ideas_portal_bash
    image: cloudblueconnect/connect-extension-runner:26.38
    working_dir: /extension
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/extension
    env_file:
      - .ideas_portal_dev.env

  ideas_portal_test:
    container_name: ideas_portal_test
    image: cloudblueconnect/connect-extension-runner:26.38
    working_dir: /extension
    command: /bin/bash -c "poetry install && pytest --verbose --cov=connect_ext --cov-report=html --cov-report=term-missing:skip-covered"
    volumes:
      - .:/extension
    env_file:
      - .ideas_portal_dev.env
